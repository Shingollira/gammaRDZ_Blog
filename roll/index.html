<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouBeenTrolled</title>
<link rel="icon" href="trollface.png" type="image/png">

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: "Times New Roman", serif;
}

#msg {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 40px;
  font-weight: bold;
  z-index: 10;
  text-shadow: 0 0 15px black;
}

video {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: black;
}
</style>
</head>

<body>

<div id="msg">You just got rickrolled, kid.</div>

<video id="vid" autoplay muted playsinline>
  <source src="https://rick.andrut.org/video.mp4" type="video/mp4">
</video>

<script>

const video = document.getElementById("vid");

const params = new URLSearchParams(location.search);
const redirect = params.get("msg");

document.body.addEventListener("click", () => {
  video.muted = false;
});

if (redirect) {

  let jumped = false;
  let redirected = false;

  // intro
  const introTime = 18;

  // drop
  const dropTime = 43;

  // redirect
  const redirectTime = 60;

  video.addEventListener("timeupdate", () => {

    if (!jumped && video.currentTime >= introTime) {

      jumped = true;

      video.currentTime = dropTime;
    }

    if (
  jumped &&
  !redirected &&
  video.currentTime >= redirectTime
) {

  redirected = true;

  window.location.href = redirect;
}

  });

  video.play();

} else {

  video.addEventListener("ended", () => {
    console.log("finish video");
  });

}

</script>

</body>
</html>
